# Reusable: a host repo's check, for every push and pull request. The repo
# must configure exactly `hosts` (everything in it is readable from each box,
# so it must never hold another server's configuration); then nix flake
# check builds every check, the hosts' systems included. The logic is
# ci/host-check.sh at the nixos-modules commit the caller's flake.lock pins.
#
#   on: { push: {}, pull_request: {}, workflow_dispatch: {} }
#   jobs:
#     check:
#       # Skip a fork's pull request: on a self-hosted runner it would run
#       # anyone's code (README: Self-hosted runners).
#       if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
#       uses: ethpandaops/nixos-modules/.github/workflows/host-check.yaml@<commit>
#       with:
#         hosts: myhost
#     deploy:
#       needs: check
#       if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
#       permissions: { contents: write }
#       uses: ethpandaops/nixos-modules/.github/workflows/host-deploy.yaml@<commit>
#       with: { host: myhost, sha: "${{ github.sha }}" }
#
# A repo that deploys from master needs that deploy job. The jobs that commit
# (update-nixpkgs, refresh-keys, bump-modules) dispatch check with
# GITHUB_TOKEN, and a run GITHUB_TOKEN started fires no workflow_run, so a
# deploy workflow on check's workflow_run never sees it: the dispatched check
# deploys itself. A pushed commit's check deploys through host-deploy's
# workflow_run caller.
name: host-check
on:
  workflow_call:
    inputs:
      hosts:
        description: The nixosConfigurations the repo must hold, space-separated (empty skips the guard)
        type: string
        default: ""
      runs-on:
        description: 'The runner: a label, or JSON for labels or a runner group, such as {"group": "my-hosts", "labels": ["my-hosts"]} (README: Self-hosted runners)'
        type: string
        default: ubuntu-latest
jobs:
  check:
    runs-on: ${{ (startsWith(inputs.runs-on, '{') || startsWith(inputs.runs-on, '[')) && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: no token in .git while the build runs.
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: Check
        env:
          HOSTS: ${{ inputs.hosts }}
        run: nix run --inputs-from . nixos-modules#host-check -- --hosts "$HOSTS"
