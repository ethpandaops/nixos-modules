# ethpandaops.reboot.trial: nixhost-boot writes nixhost/boot.cfg next to this
# file, with an entry for the last confirmed system as the default and, while
# a trial is armed, one for the deployed system. nixhost/env holds the trial
# flag. Boot the trial only once the flag is cleared on disk, so a trial that
# hangs comes back to the confirmed system; if it can't be cleared, don't
# boot the trial at all.
set nixhost_dir="$prefix/nixhost"
export nixhost_dir
set nixhost_trial_system=
if [ -f "$nixhost_dir/boot.cfg" ]; then
  source "$nixhost_dir/boot.cfg"
fi
if [ -n "$nixhost_trial_system" ]; then
  set nixhost_trial=
  load_env --skip-sig --file "$nixhost_dir/env" nixhost_trial
  if [ "$nixhost_trial" = "$nixhost_trial_system" ]; then
    set nixhost_trial=
    if save_env --file "$nixhost_dir/env" nixhost_trial; then
      set default=nixhost-trial
    else
      # GRUB can't write through md RAID ("diskfilter writes are not
      # supported"), so clear the copy on each member of the array: the same
      # filesystem, read directly. Every copy has to be cleared, or a reset
      # could read a stale one and boot the trial again.
      insmod regexp
      regexp --set=1:nixhost_dev --set=2:nixhost_path '^\(([^)]*)\)(.*)$' "$nixhost_dir"
      set nixhost_uuid=
      probe --set=nixhost_uuid --fs-uuid "$nixhost_dev"
      set nixhost_cleared=
      set nixhost_failed=
      for nixhost_copy in (*)$nixhost_path/env; do
        set nixhost_member=
        set nixhost_member_uuid=
        # Members are partitions, (hd0,gpt2); the array itself, which GRUB
        # may also call mduuid/..., isn't.
        if regexp --set=1:nixhost_member '^\(([^),]*,[^)]*)\)' "$nixhost_copy"; then
          probe --set=nixhost_member_uuid --fs-uuid "$nixhost_member"
        fi
        if [ -n "$nixhost_uuid" -a -n "$nixhost_member" -a "$nixhost_member_uuid" = "$nixhost_uuid" ]; then
          if save_env --file "$nixhost_copy" nixhost_trial; then
            set nixhost_cleared=1
          else
            set nixhost_failed=1
          fi
        fi
      done
      if [ -n "$nixhost_cleared" -a -z "$nixhost_failed" ]; then
        set default=nixhost-trial
      else
        echo "nixhost: can't clear the trial flag on disk; booting the last confirmed system"
      fi
    fi
  fi
fi
